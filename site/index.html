<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chalk Broom — Simulator</title>
<style>
  :root{--bg:#12161c;--panel:#1c2530;--line:#3a4c60;--ink:#e8eef6;--dim:#8fa3b8;--amber:#ffd479;--ground:#2a2622;--good:#4fa36a;--bad:#d4743f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;color:var(--amber);font-weight:600}
  .sub{color:var(--dim);font-size:11px}
  main{display:flex;gap:14px;padding:14px 20px;flex-wrap:wrap;align-items:flex-start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
  .grow{flex:1 1 640px;min-width:300px}
  canvas{display:block;width:100%;height:auto;background:var(--ground);border-radius:4px}
  #chalks{background:transparent}
  label{display:block;margin:9px 0 3px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  input[type=text],input[type=number],select{background:#0e1319;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:6px 8px;font:inherit;width:100%}
  input[type=range]{width:100%;accent-color:var(--amber)}
  button{background:var(--amber);color:#12161c;border:0;border-radius:4px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.tiny{padding:5px 8px;font-size:11px}
  button:disabled{opacity:.35;cursor:default}
  .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .stat{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;padding:1px 0}
  .stat b{color:var(--ink);font-weight:600}
  .bits{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin-top:8px}
  .bit{aspect-ratio:1;border-radius:2px;background:#0e1319;border:1px solid var(--line)}
  .bit.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 6px rgba(255,212,121,.5)}
  #drop{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--dim);cursor:pointer;transition:.15s;font-size:12px}
  #drop.hover{border-color:var(--amber);color:var(--amber);background:rgba(255,212,121,.05)}
  #thumb{max-width:100%;image-rendering:pixelated;border-radius:4px;margin-top:8px;display:none;background:#fff}
  .tabs{display:flex;gap:5px;margin-bottom:8px}
  .tab{flex:1;text-align:center;padding:6px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:11px;color:var(--dim)}
  .tab.active{border-color:var(--amber);color:var(--amber);background:rgba(255,212,121,.08)}
  .err{color:#ff9a6b;font-size:11px;margin-top:5px}
  .hint{color:var(--dim);font-size:10px;margin-top:4px;line-height:1.35}
  .warn{color:#ff9a6b}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  #hist{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  #hist canvas{width:52px;image-rendering:pixelated;border:1px solid var(--line);border-radius:3px;cursor:pointer}
  .kbd{background:#0e1319;border:1px solid var(--line);border-radius:3px;padding:1px 4px;font-size:10px}
</style>
</head>
<body>
<header>
  <h1>⚡ Chalk Broom</h1>
  <span class="sub">16 lanes · encoder column clock · <span id="version">v2</span></span>
</header>
<main>
  <section class="panel grow">
    <canvas id="ground" width="1400" height="380"></canvas>
    <canvas id="chalks" width="1400" height="112" style="margin-top:8px"></canvas>
  </section>

  <aside class="panel" style="flex:0 0 340px">
    <div class="tabs">
      <div class="tab active" data-mode="text">Text</div>
      <div class="tab" data-mode="image">Image</div>
      <div class="tab" data-mode="code">Code</div>
    </div>

    <div id="pane-text">
      <label for="text">Text</label>
      <input id="text" type="text" value="MEISTRO" maxlength="40">
      <div class="row">
        <select id="font" style="flex:1">
          <option value="monospace">mono</option>
          <option value="bold 15px monospace">mono bold</option>
          <option value="15px sans-serif">sans</option>
          <option value="bold 15px sans-serif">sans bold</option>
          <option value="15px serif">serif</option>
        </select>
      </div>
    </div>

    <div id="pane-image" style="display:none">
      <div id="drop"><b>Drop / tap for image</b><br><span style="font-size:10px">PNG · JPG · GIF · BMP</span></div>
      <input id="file" type="file" accept="image/*" style="display:none">
      <canvas id="thumb" width="300" height="16"></canvas>
      <div class="err" id="err"></div>
      <label>Crop / zoom <span id="zoompv">fit</span></label>
      <input id="zoom" type="range" min="100" max="300" value="100">
      <div class="row">
        <button class="tiny ghost" id="dither">Dither</button>
        <button class="tiny ghost" id="edges">Edges</button>
      </div>
    </div>

    <div id="pane-code" style="display:none">
      <label>Barcode (Code 39)</label>
      <input id="barcode" type="text" placeholder="MEISTRO" value="MEISTRO">
      <div class="hint">A-E, 1-9, dash, dot, space</div>
    </div>

    <label>Column pitch <span id="pitchv">12 mm</span></label>
    <input id="pitch" type="range" min="4" max="40" value="12">

    <label>Push speed <span id="speedv">0.6 m/s</span></label>
    <input id="speed" type="range" min="10" max="200" value="60">

    <label>Threshold <span id="thrv">128</span></label>
    <input id="thr" type="range" min="20" max="235" value="128">

    <label>Dwell (chalk hold) <span id="dwellv">100%</span></label>
    <input id="dwell" type="range" min="30" max="100" value="100">

    <label>Lane offset <span id="lanev">0</span></label>
    <input id="laneoff" type="range" min="0" max="15" value="0">

    <div class="row">
      <button id="go">Push ▶</button>
      <button id="pause" class="ghost" disabled>Pause</button>
      <button id="clear" class="ghost">Clear</button>
    </div>
    <div class="row">
      <button class="tiny ghost" id="invert">Invert</button>
      <button class="tiny ghost" id="mirror">Mirror</button>
      <button class="tiny ghost" id="flipv">Flip V</button>
      <button class="tiny ghost" id="export">Export</button>
    </div>

    <div style="margin-top:12px">
      <div class="stat"><span>Distance</span><b id="s-dist">0.00 m</b></div>
      <div class="stat"><span>Columns</span><b id="s-col">0</b></div>
      <div class="stat"><span>Encoder counts</span><b id="s-enc">0</b></div>
      <div class="stat"><span>Chalks down</span><b id="s-down">0</b></div>
      <div class="stat"><span>Drawing length</span><b id="s-len">0.00 m</b></div>
      <div class="stat"><span>Chalk wear (est)</span><b id="s-wear">0 mm</b></div>
      <div class="stat"><span>Data size</span><b id="s-bytes">0 B</b></div>
    </div>

    <div class="bits" id="bits"></div>

    <details>
      <summary>History</summary>
      <div id="hist"></div>
    </details>

    <div class="hint" style="margin-top:10px">
      <span class="kbd">Space</span> push/pause · <span class="kbd">C</span> clear · <span class="kbd">I</span> invert
    </div>
  </aside>
</main>
<script>
(() => {
const G = document.getElementById('ground').getContext('2d');
const C = document.getElementById('chalks').getContext('2d');
const GW = 1400, GH = 380, CW = 1400, CH = 112;
const LANES = 16, CHALK_MM = 25.4, WHEEL_MM = 50;
const ENC_CPR = 1024, ENC_4X = ENC_CPR * 4;
const WHEEL_CIRC = Math.PI * WHEEL_MM;
const ROW_H = 21, PX_PER_MM = GW / 2400;

let pitchMm = 12, speedMs = 0.6, threshold = 128, inverted = false;
let mirrored = false, flipped = false, ditherOn = false, edgesOn = false;
let dwellPct = 100, laneOffset = 0, zoomPct = 100;
let running = false, paused = false, mode = 'text';
let sourceImg = null, sourceCanvas = null;
let pattern = [], colIndex = 0, distMm = 0, acc = 0;
const history = [];

// 1. TEXT MODE with font selection
function renderText(text, font) {
  const cv = document.createElement('canvas');
  cv.width = 2600; cv.height = 16;
  const o = cv.getContext('2d');
  o.fillStyle = '#fff'; o.fillRect(0, 0, cv.width, cv.height);
  o.fillStyle = '#000';
  o.font = font;
  o.textBaseline = 'middle';
  o.fillText(text.toUpperCase(), 2, cv.height / 2 + 1);
  return cv;
}

// 15. CODE MODE — Code 39 barcode generator
const C39 = {'0':'101001101101','1':'110100101011','2':'101100101011','3':'110110010101',
'4':'101001101011','5':'110100110101','6':'101100110101','7':'101001011011',
'8':'110100101101','9':'101100101101','A':'110101001011','B':'101101001011',
'C':'110110100101','D':'101011001011','E':'110101100101','F':'101101100101',
'G':'101010011011','H':'110101001101','I':'101101001101','J':'101011001101',
'K':'110101010011','L':'101101010011','M':'110110101001','N':'101011010011',
'O':'110101101001','P':'101101101001','Q':'101010110011','R':'110101011001',
'S':'101101011001','T':'101011011001','U':'110010101011','V':'100110101011',
'W':'110011010101','X':'100101101011','Y':'110010110101','Z':'100110110101',
'-':'100101011011','.':'110010101101',' ':'100110101101','*':'100101101101'};
function renderBarcode(text) {
  const cps = ['*'].concat(text.toUpperCase().split('')).concat(['*']);
  let bits = [];
  cps.forEach((ch, i) => {
    const p = C39[ch]; if (!p) return;
    for (const b of p) bits.push(b === '1' ? 1 : 0);
    if (i < cps.length - 1) bits.push(0);
  });
  const cv = document.createElement('canvas');
  cv.width = bits.length; cv.height = 16;
  const o = cv.getContext('2d');
  o.fillStyle = '#fff'; o.fillRect(0, 0, cv.width, cv.height);
  o.fillStyle = '#000';
  bits.forEach((b, x) => { if (b) o.fillRect(x, 0, 1, 16); });
  return cv;
}

// 2/3/4. IMAGE MODE — zoom/crop, dither, edge detect
function imageToStrip(img) {
  const h = 16;
  const aspect = img.width / img.height;
  const w = Math.max(1, Math.round(h * aspect));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const o = cv.getContext('2d');
  o.fillStyle = '#fff'; o.fillRect(0, 0, w, h);
  // zoom: crop a centred region then scale to strip
  const z = zoomPct / 100;
  const sw = img.width / z, sh = img.height / z;
  const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
  o.imageSmoothingQuality = 'high';
  o.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  return cv;
}
function applyEdges(cv) {
  const o = cv.getContext('2d');
  const d = o.getImageData(0, 0, cv.width, cv.height);
  const {width: w, height: h} = cv;
  const out = o.createImageData(w, h);
  const lum = (i) => 0.299*d.data[i] + 0.587*d.data[i+1] + 0.114*d.data[i+2];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y*w+x)*4;
    const l = lum(i);
    const r = x < w-1 ? lum(i+4) : l;
    const b = y < h-1 ? lum(i+w*4) : l;
    const g = Math.min(255, Math.abs(l-r) + Math.abs(l-b));
    const v = 255 - g;
    out.data[i]=out.data[i+1]=out.data[i+2]=v; out.data[i+3]=255;
  }
  o.putImageData(out, 0, 0);
}
function toPattern(cv, thr, inv, dither) {
  const o = cv.getContext('2d');
  const {width: w, height: h} = cv;
  const d = o.getImageData(0, 0, w, h).data;
  const cols = [];
  const lum = (i) => 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  // Floyd-Steinberg when dither enabled
  let errs = null;
  if (dither) {
    errs = new Float32Array(w*h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y*w+x)*4;
      const old = lum(i) + errs[y*w+x];
      const nw = old < thr ? 0 : 255;
      const e = old - nw;
      if (x < w-1) errs[y*w+x+1] += e * 7/16;
      if (y < h-1) {
        if (x > 0) errs[(y+1)*w+x-1] += e * 3/16;
        errs[(y+1)*w+x] += e * 5/16;
        if (x < w-1) errs[(y+1)*w+x+1] += e * 1/16;
      }
      d[i] = d[i+1] = d[i+2] = nw;
    }
  }
  for (let x = 0; x < w; x++) {
    let v = 0;
    for (let y = 0; y < h; y++) {
      const i = (y*w+x)*4;
      let ink = lum(i) < thr;
      if (inv) ink = !ink;
      if (ink) v |= (1 << y);
    }
    cols.push(v);
  }
  while (cols.length && cols[cols.length-1] === 0) cols.pop();
  while (cols.length && cols[0] === 0) cols.shift();
  return cols;
}

// 5/6. TRANSFORMS — mirror, flip, lane rotate
function transformCols(cols) {
  let out = cols.slice();
  if (mirrored) {
    out = out.map(v => {
      let r = 0;
      for (let b = 0; b < LANES; b++) if (v & (1<<b)) r |= (1 << (LANES-1-b));
      return r;
    });
  }
  if (flipped) out.reverse();
  if (laneOffset) {
    out = out.map(v => {
      let r = 0;
      for (let b = 0; b < LANES; b++) if (v & (1<<b)) r |= (1 << ((b + laneOffset) % LANES));
      return r;
    });
  }
  return out;
}

function rebuild() {
  if (mode === 'text') {
    sourceCanvas = renderText(document.getElementById('text').value || ' ',
                              document.getElementById('font').value);
  } else if (mode === 'code') {
    sourceCanvas = renderBarcode(document.getElementById('barcode').value || ' ');
  } else if (mode === 'image') {
    if (!sourceImg) { pattern = []; updateStats(); return; }
    sourceCanvas = imageToStrip(sourceImg);
    if (edgesOn) applyEdges(sourceCanvas);
    const th = document.getElementById('thumb');
    th.width = sourceCanvas.width; th.height = 16;
    th.style.display = 'block';
    const tc = th.getContext('2d');
    tc.imageSmoothingEnabled = false;
    tc.drawImage(sourceCanvas, 0, 0);
  }
  if (!sourceCanvas) { pattern = []; return; }
  pattern = transformCols(toPattern(sourceCanvas, threshold, inverted, ditherOn && mode === 'image'));
  resetRun();
  updateStats();
}

function updateStats() {
  document.getElementById('s-len').textContent = (pattern.length * pitchMm / 1000).toFixed(2) + ' m';
  document.getElementById('s-bytes').textContent = (pattern.length * 2) + ' B';
}

function resetRun() {
  running = false; paused = false;
  colIndex = 0; distMm = 0; acc = 0;
  document.getElementById('go').disabled = false;
  document.getElementById('pause').disabled = true;
  clearGround(); setBits(0);
  document.getElementById('s-dist').textContent = '0.00 m';
  document.getElementById('s-col').textContent = '0';
  document.getElementById('s-enc').textContent = '0';
  document.getElementById('s-wear').textContent = '0 mm';
}

function clearGround() {
  G.fillStyle = '#2a2622'; G.fillRect(0, 0, GW, GH);
  G.strokeStyle = 'rgba(255,255,255,.04)'; G.lineWidth = 1;
  for (let x = 0; x < GW; x += 50) { G.beginPath(); G.moveTo(x,0); G.lineTo(x,GH); G.stroke(); }
}

// 7. DWELL — how long each column is held (line weight)
function drawColumn(px, bits) {
  const wpx = Math.max(1, pitchMm * PX_PER_MM * (dwellPct / 100));
  for (let lane = 0; lane < LANES; lane++) {
    if (bits & (1 << lane)) {
      const y = 24 + lane * ROW_H;
      const a = (0.78 + Math.random() * 0.18).toFixed(2);
      G.fillStyle = 'rgba(242,239,230,' + a + ')';
      G.fillRect(px, y, wpx, ROW_H * 0.78);
    }
  }
}

function drawChalkRow(bits) {
  C.clearRect(0, 0, CW, CH);
  const startX = CW / 2 - 240;
  for (let lane = 0; lane < LANES; lane++) {
    const x = startX + lane * 30;
    const down = !!(bits & (1 << lane));
    C.fillStyle = down ? '#f2efe6' : '#3a3630';
    C.fillRect(x + 9, 10, 12, 46);
    C.strokeStyle = '#3a4c60'; C.strokeRect(x + 9, 10, 12, 46);
    C.fillStyle = '#8fa3b8'; C.font = '9px monospace'; C.textAlign = 'center';
    C.fillText(lane, x + 15, 72);
  }
  C.fillStyle = '#8fa3b8'; C.font = '11px monospace'; C.textAlign = 'center';
  C.fillText('chalk row — from above, ' + LANES + ' lanes', CW / 2, 94);
}

const bitsEl = document.getElementById('bits');
for (let i = 0; i < LANES; i++) {
  const d = document.createElement('div'); d.className = 'bit'; d.id = 'b' + i;
  bitsEl.appendChild(d);
}
function setBits(bits) {
  let n = 0;
  for (let i = 0; i < LANES; i++) {
    const on = !!(bits & (1 << i));
    document.getElementById('b' + i).classList.toggle('on', on);
    if (on) n++;
  }
  document.getElementById('s-down').textContent = n;
}

let last = 0;
function frame(t) {
  if (!last) last = t;
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (running && !paused) {
    const dMm = speedMs * 1000 * dt;
    distMm += dMm; acc += dMm;
    while (acc >= pitchMm) {
      acc -= pitchMm;
      const bits = colIndex < pattern.length ? pattern[colIndex] : 0;
      const px = 20 + colIndex * pitchMm * PX_PER_MM;
      if (px < GW) drawColumn(px, bits);
      setBits(bits);
      colIndex++;
      if (colIndex > pattern.length + 8) { running = false; document.getElementById('pause').disabled = true; }
    }
    document.getElementById('s-dist').textContent = (distMm/1000).toFixed(2) + ' m';
    document.getElementById('s-col').textContent = colIndex;
    document.getElementById('s-enc').textContent = Math.floor(distMm * ENC_4X / WHEEL_CIRC);
    // 8. chalk wear estimate: total lane-mm drawn / lane count
    document.getElementById('s-wear').textContent = (distMm / 1000 * 0.08).toFixed(2) + ' mm';
  }
  requestAnimationFrame(frame);
}

// 9. HISTORY — thumbnails of recent patterns
function pushHistory() {
  if (!pattern.length) return;
  const cv = document.createElement('canvas');
  cv.width = Math.min(pattern.length, 200); cv.height = 16;
  const o = cv.getContext('2d');
  o.fillStyle = '#000'; o.fillRect(0,0,cv.width,16);
  o.fillStyle = '#fff';
  for (let x = 0; x < cv.width; x++) {
    const v = pattern[x] || 0;
    for (let y = 0; y < 16; y++) if (v & (1<<y)) o.fillRect(x, y, 1, 1);
  }
  history.unshift(cv);
  if (history.length > 8) history.pop();
  const h = document.getElementById('hist');
  h.innerHTML = '';
  history.forEach(c => {
    const w = document.createElement('canvas');
    w.width = c.width; w.height = 16;
    w.getContext('2d').drawImage(c, 0, 0);
    w.title = c.width + ' columns';
    w.addEventListener('click', () => {
      // restore pattern from thumbnail
      pattern = [];
      const o2 = w.getContext('2d');
      const d = o2.getImageData(0,0,w.width,16).data;
      for (let x = 0; x < w.width; x++) {
        let v = 0;
        for (let y = 0; y < 16; y++) {
          const i = (y*w.width+x)*4;
          if (d[i] > 100) v |= (1<<y);
        }
        pattern.push(v);
      }
      resetRun(); updateStats();
    });
    h.appendChild(w);
  });
}

// 10. EXPORT — download the .cbw file
function exportCBW() {
  if (!pattern.length) return;
  const buf = new ArrayBuffer(7 + pattern.length * 2);
  const dv = new DataView(buf);
  dv.setUint8(0,0x43); dv.setUint8(1,0x42); dv.setUint8(2,0x57); dv.setUint8(3,0x31);
  dv.setUint16(4, pattern.length, true);
  dv.setUint8(6, 16);
  pattern.forEach((c, i) => dv.setUint16(7 + i*2, c, true));
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chalkbroom.cbw';
  a.click();
  URL.revokeObjectURL(a.href);
}

// controls
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  mode = t.dataset.mode;
  document.getElementById('pane-text').style.display = mode === 'text' ? 'block' : 'none';
  document.getElementById('pane-image').style.display = mode === 'image' ? 'block' : 'none';
  document.getElementById('pane-code').style.display = mode === 'code' ? 'block' : 'none';
  rebuild();
}));

const drop = document.getElementById('drop'), fileIn = document.getElementById('file');
drop.addEventListener('click', () => fileIn.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('hover');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileIn.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

function loadFile(file) {
  const err = document.getElementById('err'); err.textContent = '';
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    sourceImg = img;
    URL.revokeObjectURL(url);
    rebuild();
  };
  img.onerror = () => { err.textContent = 'Could not read that as an image.'; URL.revokeObjectURL(url); };
  img.src = url;
}

document.getElementById('go').addEventListener('click', () => {
  if (!pattern.length) return;
  if (!running) { colIndex = 0; distMm = 0; acc = 0; clearGround(); }
  running = true; paused = false;
  document.getElementById('go').disabled = true;
  document.getElementById('pause').disabled = false;
  pushHistory();
});
document.getElementById('pause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('pause').textContent = paused ? 'Resume' : 'Pause';
});
document.getElementById('clear').addEventListener('click', resetRun);
document.getElementById('invert').addEventListener('click', () => { inverted = !inverted; rebuild(); });
document.getElementById('mirror').addEventListener('click', () => { mirrored = !mirrored; rebuild(); });
document.getElementById('flipv').addEventListener('click', () => { flipped = !flipped; rebuild(); });
document.getElementById('export').addEventListener('click', exportCBW);
document.getElementById('dither').addEventListener('click', e => {
  ditherOn = !ditherOn; e.target.style.color = ditherOn ? 'var(--amber)' : '';
  rebuild();
});
document.getElementById('edges').addEventListener('click', e => {
  edgesOn = !edgesOn; e.target.style.color = edgesOn ? 'var(--amber)' : '';
  rebuild();
});
document.getElementById('text').addEventListener('input', rebuild);
document.getElementById('barcode').addEventListener('input', rebuild);
document.getElementById('font').addEventListener('change', rebuild);
document.getElementById('zoom').addEventListener('input', e => {
  zoomPct = +e.target.value;
  document.getElementById('zoompv').textContent = zoomPct === 100 ? 'fit' : (zoomPct/100).toFixed(1) + '×';
  if (mode === 'image') rebuild();
});
document.getElementById('pitch').addEventListener('input', e => {
  pitchMm = +e.target.value;
  document.getElementById('pitchv').textContent = pitchMm + ' mm';
  updateStats(); resetRun();
});
document.getElementById('speed').addEventListener('input', e => {
  speedMs = +e.target.value / 100;
  document.getElementById('speedv').textContent = speedMs.toFixed(1) + ' m/s';
});
document.getElementById('thr').addEventListener('input', e => {
  threshold = +e.target.value;
  document.getElementById('thrv').textContent = threshold;
  rebuild();
});
document.getElementById('dwell').addEventListener('input', e => {
  dwellPct = +e.target.value;
  document.getElementById('dwellv').textContent = dwellPct + '%';
});
document.getElementById('laneoff').addEventListener('input', e => {
  laneOffset = +e.target.value;
  document.getElementById('lanev').textContent = laneOffset;
  rebuild();
});

// keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); running ? document.getElementById('pause').click() : document.getElementById('go').click(); }
  if (e.key === 'c' || e.key === 'C') resetRun();
  if (e.key === 'i' || e.key === 'I') { inverted = !inverted; rebuild(); }
});

rebuild();
clearGround();
drawChalkRow(0);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
