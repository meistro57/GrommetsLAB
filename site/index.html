<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chalk Broom — Simulator</title>
<style>
  :root{--bg:#12161c;--panel:#1c2530;--line:#3a4c60;--ink:#e8eef6;--dim:#8fa3b8;--amber:#ffd479;--chalk:#f2efe6;--ground:#2a2622}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
  header{padding:16px 20px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:18px;color:var(--amber);font-weight:600}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  main{display:flex;gap:16px;padding:16px 20px;flex-wrap:wrap}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
  .grow{flex:1 1 640px;min-width:320px}
  canvas{display:block;width:100%;height:auto;background:var(--ground);border-radius:4px}
  #chalks{background:transparent}
  label{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--dim)}
  input[type=text],select{background:#0e1319;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:6px 8px;font:inherit;width:100%}
  input[type=range]{width:100%}
  button{background:var(--amber);color:#12161c;border:0;border-radius:4px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .row{display:flex;gap:8px;margin-top:10px}
  .stat{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;padding:2px 0}
  .stat b{color:var(--ink);font-weight:600}
  .bits{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:8px}
  .bit{aspect-ratio:1;border-radius:2px;background:#0e1319;border:1px solid var(--line)}
  .bit.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px rgba(255,212,121,.6)}
</style>
</head>
<body>
<header>
  <h1>⚡ Chalk Broom — Simulator</h1>
  <div class="sub">16 lanes · encoder-driven column clock · push it and it draws</div>
</header>
<main>
  <section class="panel grow">
    <canvas id="ground" width="1400" height="360"></canvas>
    <canvas id="chalks" width="1400" height="110" style="margin-top:8px"></canvas>
  </section>
  <aside class="panel" style="flex:0 0 320px">
    <label for="text">Text</label>
    <input id="text" type="text" value="MEISTRO" maxlength="24">
    <label for="pitch" style="margin-top:12px">Column pitch <span id="pitchv">12 mm</span></label>
    <input id="pitch" type="range" min="4" max="40" value="12">
    <label for="speed">Push speed <span id="speedv">0.6 m/s</span></label>
    <input id="speed" type="range" min="10" max="150" value="60">
    <div class="row">
      <button id="go">Push ▶</button>
      <button id="clear" class="ghost">Clear</button>
    </div>
    <div style="margin-top:14px">
      <div class="stat"><span>Distance</span><b id="s-dist">0.00 m</b></div>
      <div class="stat"><span>Columns</span><b id="s-col">0</b></div>
      <div class="stat"><span>Encoder counts</span><b id="s-enc">0</b></div>
      <div class="stat"><span>Chalks down</span><b id="s-down">0</b></div>
    </div>
    <div class="bits" id="bits"></div>
    <div class="sub" style="margin-top:10px">Pattern is indexed by <b>distance</b>, not time — walking faster cannot stretch the letters.</div>
  </aside>
</main>
<script>
(() => {
const G = document.getElementById('ground').getContext('2d');
const C = document.getElementById('chalks').getContext('2d');
const GW = 1400, GH = 360, CW = 1400, CH = 110;

const LANES = 16;
const CHALK_MM = 25.4;         // 1 inch chalk
const LANE_MM = CHALK_MM;      // side by side
const WHEEL_MM = 50;           // drive wheel
const ENC_CPR = 1024;          // 1024 CPR, 4x decode
const ENC_4X = ENC_CPR * 4;
const WHEEL_CIRC = Math.PI * WHEEL_MM;

const PX_PER_MM = GW / 2400;   // fit ~2.4 m of drawing on screen
const ROW_H = 20;              // visual lane height on canvas

let pitchMm = 12;
let speedMs = 0.6;
let running = false;

// ---- pattern source: render text to a 16-high bitmap ----
function makePattern(text) {
  const off = document.createElement('canvas');
  const h = 16;
  off.width = 2400; off.height = h;
  const o = off.getContext('2d');
  o.fillStyle = '#000'; o.fillRect(0, 0, off.width, h);
  o.fillStyle = '#fff';
  o.font = 'bold 14px monospace';
  o.textBaseline = 'middle';
  o.fillText(text.toUpperCase(), 4, h / 2 + 1);
  const d = o.getImageData(0, 0, off.width, h).data;
  const cols = [];
  for (let x = 0; x < off.width; x++) {
    let v = 0;
    for (let y = 0; y < h; y++) {
      const i = (y * off.width + x) * 4;
      if (d[i] > 128) v |= (1 << y);
    }
    cols.push(v);
  }
  // trim trailing empty columns
  while (cols.length && cols[cols.length - 1] === 0) cols.pop();
  return cols;
}

let pattern = makePattern('MEISTRO');
let colIndex = 0;
let distMm = 0;
let acc = 0;
let countsPerCol = 0;

function recompute() {
  countsPerCol = ENC_4X * pitchMm / WHEEL_CIRC;
}

// ---- drawing ----
function clearGround() {
  G.fillStyle = '#2a2622'; G.fillRect(0, 0, GW, GH);
  G.strokeStyle = 'rgba(255,255,255,.04)'; G.lineWidth = 1;
  for (let x = 0; x < GW; x += 50) { G.beginPath(); G.moveTo(x, 0); G.lineTo(x, GH); G.stroke(); }
}
function drawColumn(px, bits) {
  for (let lane = 0; lane < LANES; lane++) {
    if (bits & (1 << lane)) {
      const y = 20 + lane * ROW_H;
      const alpha = 0.55 + 0.45 * Math.random() * 0.2;
      G.fillStyle = 'rgba(242,239,230,' + alpha.toFixed(2) + ')';
      G.fillRect(px, y, Math.max(1, pitchMm * PX_PER_MM), ROW_H * 0.8);
    }
  }
}
function drawChalkRow(bits) {
  C.clearRect(0, 0, CW, CH);
  const totalW = LANES * (CH - 20) / LANES;
  const startX = CW / 2 - 240;
  for (let lane = 0; lane < LANES; lane++) {
    const x = startX + lane * 30;
    const down = !!(bits & (1 << lane));
    C.fillStyle = down ? '#f2efe6' : '#3a3630';
    C.fillRect(x + 9, 10, 12, 46);
    C.strokeStyle = '#3a4c60';
    C.strokeRect(x + 9, 10, 12, 46);
    C.fillStyle = '#8fa3b8'; C.font = '9px monospace'; C.textAlign = 'center';
    C.fillText(lane, x + 15, 72);
  }
  C.fillStyle = '#8fa3b8'; C.font = '11px monospace';
  C.fillText('chalk row (viewed from above, ' + LANES + ' lanes)', CW / 2, 92);
}

// ---- bit indicators ----
const bitsEl = document.getElementById('bits');
for (let i = 0; i < LANES; i++) {
  const d = document.createElement('div'); d.className = 'bit'; d.id = 'b' + i;
  bitsEl.appendChild(d);
}
function setBits(bits) {
  let n = 0;
  for (let i = 0; i < LANES; i++) {
    const on = !!(bits & (1 << i));
    document.getElementById('b' + i).classList.toggle('on', on);
    if (on) n++;
  }
  document.getElementById('s-down').textContent = n;
}

// ---- main loop ----
let last = 0, pend = 0;
function frame(t) {
  if (!last) last = t;
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (running) {
    const dMm = speedMs * 1000 * dt;
    distMm += dMm;
    acc += dMm;
    while (acc >= pitchMm) {
      acc -= pitchMm;
      const bits = colIndex < pattern.length ? pattern[colIndex] : 0;
      const px = (colIndex * pitchMm * PX_PER_MM) + 20;
      if (px < GW) drawColumn(px, bits);
      setBits(bits);
      colIndex++;
      if (colIndex > pattern.length + 10) { running = false; }
    }
    document.getElementById('s-dist').textContent = (distMm / 1000).toFixed(2) + ' m';
    document.getElementById('s-col').textContent = colIndex;
    document.getElementById('s-enc').textContent = Math.floor(distMm * ENC_4X / WHEEL_CIRC);
  }
  requestAnimationFrame(frame);
}

// ---- controls ----
document.getElementById('go').addEventListener('click', () => {
  running = true; colIndex = 0; distMm = 0; acc = 0;
  clearGround();
});
document.getElementById('clear').addEventListener('click', () => {
  running = false; colIndex = 0; distMm = 0; acc = 0;
  clearGround(); setBits(0);
  document.getElementById('s-dist').textContent = '0.00 m';
  document.getElementById('s-col').textContent = '0';
  document.getElementById('s-enc').textContent = '0';
});
document.getElementById('text').addEventListener('input', e => {
  pattern = makePattern(e.target.value || ' ');
  colIndex = 0; distMm = 0; acc = 0; clearGround();
});
document.getElementById('pitch').addEventListener('input', e => {
  pitchMm = +e.target.value;
  document.getElementById('pitchv').textContent = pitchMm + ' mm';
  recompute();
});
document.getElementById('speed').addEventListener('input', e => {
  speedMs = +e.target.value / 100;
  document.getElementById('speedv').textContent = speedMs.toFixed(1) + ' m/s';
});

recompute();
clearGround();
drawChalkRow(0);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
